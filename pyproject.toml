[project]
name = "flysim"
version = "0.4.0"
description = "Connectome-driven simulation of two Drosophila and a rotting apple"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "numba",
    "flygym==2.1.0",
    "mujoco>=3.3",
]

[project.optional-dependencies]
validate = ["brian2", "matplotlib", "pytest"]

[tool.setuptools.packages.find]
include = ["flysim*"]
