[project]
name = "flysim"
version = "0.4.0"
description = "Connectome-driven simulation of two Drosophila and a rotting apple"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "numba",
    "flygym==2.1.0",
    "mujoco>=3.3",
    # NVIDIA GPU support is installed automatically on Linux/Windows and used when a GPU is
    # present (FLYSIM_BACKEND=auto); macOS has no CUDA
    "numba-cuda[cu12]; sys_platform != 'darwin'",
]

[project.optional-dependencies]
validate = ["brian2", "matplotlib", "pytest"]
cuda = ["numba-cuda[cu12]"]   # kept for explicit installs

[tool.setuptools.packages.find]
include = ["flysim*"]

[tool.pytest.ini_options]
markers = ["slow: takes minutes (CUDA simulator check)"]
