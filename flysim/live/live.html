<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly-Sim</title>
<style>
:root { --bg:#f6f5f1; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e0da; --soft:#f2f1ec; --folder:#e7e5df;
  --accent:#c2410c; --orange:#ea580c; --red:#dc2626; --green:#16a34a; --male:#2563eb; --female:#db2777; --brain:#101014; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121214; --panel:#1b1b1e; --ink:#ececef;
  --muted:#9a9aa2; --line:#2c2c31; --soft:#16161a; --folder:#2c2c31; --accent:#fb923c; --male:#60a5fa; --female:#f472b6; --brain:#08080a; } }
:root[data-theme="dark"] { --bg:#121214; --panel:#1b1b1e; --ink:#ececef; --muted:#9a9aa2; --line:#2c2c31; --soft:#16161a;
  --folder:#2c2c31; --accent:#fb923c; --male:#60a5fa; --female:#f472b6; --brain:#08080a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:inherit; }
.top { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:5; }
.brand { font-weight:700; font-size:17px; cursor:pointer; }
.crumb { color:var(--muted); font-size:13px; }
.tabs { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
.btn { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:500; text-decoration:none; display:inline-block; }
.btn.dark { background:var(--ink); color:var(--panel); border-color:var(--ink); }
.btn.small { padding:3px 8px; font-size:12px; }
.btn.on { background:var(--ink); color:var(--panel); }
.btn:disabled { opacity:.5; cursor:default; }
.wrap { padding:12px 16px; }
h1 { font-size:20px; margin:0 0 2px; } .sub { color:var(--muted); font-size:13px; }
.head { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
.pill { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:3px 9px; font-size:12px; color:var(--muted); display:inline-block; }
.pill b { color:var(--ink); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.card .ch { display:flex; justify-content:space-between; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; }
.card .ch h4 { margin:0; font-size:13px; } .card .ch span { color:var(--muted); font-size:12px; }
.card .cb { padding:8px 12px; }
.field { padding:7px 0; border-bottom:1px solid var(--line); } .field:last-child { border-bottom:0; }
.field label { display:flex; justify-content:space-between; gap:8px; align-items:center; }
.field label b { font-variant-numeric:tabular-nums; }
.field input[type=range] { width:100%; accent-color:var(--ink); }
.field select { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:2px 6px; max-width:62%; }
.norm { font-size:11.5px; color:var(--muted); }
.toggle input { width:36px; height:20px; appearance:none; background:var(--folder); border-radius:99px; position:relative; cursor:pointer; flex:none; }
.toggle input::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
.toggle input:checked { background:var(--ink); } .toggle input:checked::after { left:18px; }
.run { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:12px; }
@media (max-width:900px) { .run { grid-template-columns:1fr; } }
#scene { width:100%; aspect-ratio:4/3; display:block; cursor:grab; }
.brain canvas { width:100%; aspect-ratio:16/10; display:block; background:var(--brain); cursor:grab; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:6px; padding:8px 12px; }
.stat { font-size:12px; color:var(--muted); } .stat b { display:block; color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums; }
.meter { height:3px; background:var(--folder); border-radius:3px; margin-top:4px; overflow:hidden; } .meter i { display:block; height:100%; background:var(--ink); }
.legend { display:flex; gap:10px; padding:6px 12px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
.badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; background:var(--folder); margin-left:6px; }
.badge.warn { background:#fde68a; color:#78350f; }
.evlist { max-height:560px; overflow:auto; }
.ev { border-bottom:1px solid var(--line); padding:6px 12px; cursor:pointer; font-size:13px; }
.ev:hover { background:var(--soft); }
.ev .meta { color:var(--muted); font-size:11.5px; display:flex; gap:8px; flex-wrap:wrap; }
.ev.open { background:var(--soft); }
.detail { margin-top:6px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; cursor:default; }
.detail pre { white-space:pre-wrap; margin:6px 0 0; max-height:260px; overflow:auto; font:11.5px ui-monospace,Menlo,monospace; }
.imp3 { border-left:3px solid var(--red); } .imp2 { border-left:3px solid var(--orange); } .imp1 { border-left:3px solid transparent; }
#timeline { width:100%; height:110px; display:block; cursor:crosshair; }
#regions { width:100%; height:180px; display:block; }
.flow { display:grid; grid-template-columns:repeat(10, 1fr); gap:1px; font-size:10px; margin-top:6px; }
.flow div { padding:2px; text-align:center; border-radius:2px; overflow:hidden; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:20; padding:16px; }
.modal .box { background:var(--panel); border-radius:12px; max-width:860px; width:100%; max-height:90vh; overflow:auto; padding:16px; }
.legs { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:0 12px 10px; font-size:11.5px; color:var(--muted); }
.legs b { color:var(--ink); }
.err { white-space:pre-wrap; background:#fee2e2; color:#991b1b; padding:10px; border-radius:8px; font-size:12px; margin:10px 0; }
.hidden { display:none !important; }
table.t { border-collapse:collapse; width:100%; font-size:12.5px; } table.t td, table.t th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
</style>
</head>
<body>
<div class="top">
  <span class="brand" onclick="go('#/home')">Fly-Sim</span>
  <span class="crumb" id="crumb"></span>
  <div class="tabs" id="tabs"></div>
</div>
<div class="wrap" id="view"></div>

<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function b64(s, T) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); }
const api = async (p, opt) => (await fetch(p, opt)).json();
const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });
const colorSex = sex => sex === 'male' ? css('--male') : sex === 'female' ? css('--female') : css('--muted');
const CAT_COLORS = { fight: '#dc2626', courtship: '#db2777', mating: '#a855f7', life: '#6b7280', feeding: '#16a34a', distress: '#ea580c',
  reward: '#22c55e', memory: '#2563eb', movement: '#9ca3af', social: '#0ea5e9', world: '#a16207', info: '#9ca3af' };
const CAT_RU = { fight: 'драки', courtship: 'ухаживание', mating: 'спаривание и яйца', life: 'рождения и смерти', feeding: 'кормление',
  distress: 'дистресс (корреляты)', reward: 'награда (корреляты)', memory: 'память', movement: 'перемещения', social: 'контакты', world: 'мир', info: 'прочее' };
const MODES = { connectome_only: 'только коннектом', connectome_plus_approximations: 'коннектом + приближения', experimental_shortcuts: 'есть обходы' };
let SCHEMA = null, timers = [];
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function go(h) { location.hash = h; }
function copy(text) { navigator.clipboard.writeText(text).then(() => toast('скопировано')); }
function toast(t) { const d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--panel);padding:6px 12px;border-radius:8px;z-index:30'; document.body.appendChild(d); setTimeout(() => d.remove(), 1200); }
const fmtClock = h => `д${Math.floor(h / 24)} ${(h % 24).toFixed(2)}ч`;

// ======================= router =======================
async function route() {
  clearTimers();
  if (!SCHEMA) { try { SCHEMA = await api('/api/schema'); } catch (e) { $('#view').innerHTML = '<div class="err">Нет связи с сервером Fly-Sim (docker compose up или python -m flysim.live), затем откройте http://localhost:8800</div>'; return; } }
  const [, page, id, extra] = (location.hash || '#/home').split('/');
  $('#tabs').innerHTML = `<a class="btn ${page === 'home' || !page ? 'on' : ''}" href="#/home">Наблюдения</a><a class="btn ${page === 'new' ? 'on' : ''}" href="#/new">+ Новое</a>` +
    (id ? `<a class="btn ${page === 'observe' ? 'on' : ''}" href="#/observe/${id}">Наблюдение</a><a class="btn ${page === 'chronicle' ? 'on' : ''}" href="#/chronicle/${id}">Хроника (панель бога)</a>` : '');
  if (page === 'new') return viewNew();
  if (page === 'observe') return viewObserve(id, extra);
  if (page === 'chronicle') return viewChronicle(id);
  return viewHome();
}
addEventListener('hashchange', route);

// ======================= home =======================
async function viewHome() {
  $('#crumb').textContent = 'все наблюдения';
  const d = await api('/api/sims');
  const sim = s => `<div class="card"><div class="ch"><h4>${esc(s.title)}</h4><span>${s.running ? '● идёт' : '■ завершено'}</span></div>
    <div class="cb"><div class="sub">${esc(s.status)}</div><div style="margin:6px 0">${s.kind === 'experiment' ? '<span class="pill">эксперимент</span>' : '<span class="pill">свободная симуляция</span>'}
    <span class="pill">мух <b>${s.flies}</b></span> <span class="pill">мир <b>${fmtClock(s.clock_h)}</b></span> <span class="pill">событий <b>${s.events}</b></span></div>
    <a class="btn small dark" href="#/observe/${s.run_id}">Открыть</a> <a class="btn small" href="#/chronicle/${s.run_id}">Хроника</a>
    <a class="btn small" href="#/observe/${s.run_id}" target="_blank">В новой вкладке ↗</a>
    ${s.running ? `<button class="btn small" onclick="post('/api/sim/${s.run_id}/stop').then(route)">Стоп</button>` : ''}</div></div>`;
  $('#view').innerHTML = `<div class="head"><div><h1>Наблюдения</h1><div class="sub">Можно запускать несколько одновременно и открывать каждое в своей вкладке</div></div>
    <a class="btn dark" href="#/new">+ Новое наблюдение</a></div>
    <h3 style="margin:6px 0">Идут и недавние</h3><div class="grid">${d.sims.map(sim).join('') || '<div class="sub">пока нет — начните новое</div>'}</div>
    <h3 style="margin:18px 0 6px">Сохранённые прогоны</h3><div class="grid">${d.saved.map(r => `<div class="card"><div class="ch"><h4>${esc(r.title)}</h4><span>${r.size_mb} МБ</span></div>
    <div class="cb"><div class="sub">${esc(r.run_id)}</div><a class="btn small" href="#/chronicle/${r.run_id}">Хроника</a> <a class="btn small" href="#/observe/${r.run_id}/0">Повтор</a></div></div>`).join('') || '<div class="sub">нет</div>'}</div>`;
  timers.push(setTimeout(route, 5000));
}

// ======================= new run =======================
let CFG = null, MODE = 'free';
const GROUP_TITLES = { world: 'Мир (размер, сезоны, почва, ветер)', environment: 'Воздух', apples: 'Яблоки', flies: 'Мухи', injuries: 'Травмы и схема тела',
  hot_zone: 'Неприятный стимул', science: 'Контроли (научные режимы)', run: 'Расчёт и лимиты' };
function fmtv(v, step) { return step && step < 1 ? (+v).toFixed(String(step).split('.')[1].length) : String(Math.round(v)); }
function viewNew() {
  $('#crumb').textContent = 'новое наблюдение';
  if (!CFG) CFG = JSON.parse(JSON.stringify(SCHEMA.defaults));
  const prot = SCHEMA.protocols;
  $('#view').innerHTML = `<div class="head"><div><h1>Новое наблюдение</h1><div class="sub">Сначала настройте, потом запустите. Поведением управляет симуляция коннектома; приближения помечены</div></div>
    <div><input id="title" placeholder="название (необязательно)" style="padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel)"> <button class="btn" id="reset">Сбросить</button> <button class="btn dark" id="start">Запустить ▸</button></div></div>
    <div style="margin-bottom:12px"><button class="btn ${MODE === 'free' ? 'on' : ''}" id="m-free">Свободная симуляция</button> <button class="btn ${MODE === 'exp' ? 'on' : ''}" id="m-exp">Готовый эксперимент</button></div>
    <div id="expbox" class="${MODE === 'exp' ? '' : 'hidden'} card" style="margin-bottom:12px"><div class="ch"><h4>Эксперимент</h4><span>протокол с гипотезой, группами и контролями</span></div><div class="cb">
      <div class="field"><label>Протокол<select id="e-prot">${Object.keys(prot).map(k => `<option>${k}</option>`).join('')}</select></label><div class="norm" id="e-hyp"></div></div>
      <div class="field"><label>Группа<select id="e-group"></select></label></div>
      <div class="field"><label>Seed<input id="e-seed" type="number" value="100" style="width:90px"></label><div class="norm">повторы — разные seed; для статистики — серия (scripts/series.py)</div></div></div></div>
    <div id="freebox" class="${MODE === 'free' ? '' : 'hidden'}"><div class="grid" id="form"></div></div>`;
  $('#m-free').onclick = () => { MODE = 'free'; viewNew(); };
  $('#m-exp').onclick = () => { MODE = 'exp'; viewNew(); };
  const setProt = () => { const p = prot[$('#e-prot').value]; $('#e-hyp').textContent = `Гипотеза: ${p.hypothesis} Сравнение: ${p.reference}`;
    $('#e-group').innerHTML = p.groups.map(g => `<option>${g}</option>`).join(''); };
  $('#e-prot').onchange = setProt; setProt();
  $('#reset').onclick = () => { CFG = JSON.parse(JSON.stringify(SCHEMA.defaults)); viewNew(); };
  $('#start').onclick = async () => {
    $('#start').disabled = true; $('#start').textContent = 'Загрузка мозгов…';
    let r;
    if (MODE === 'exp') r = await post('/api/experiment', { protocol: $('#e-prot').value, group: $('#e-group').value, seed: +$('#e-seed').value });
    else r = await post('/api/start', Object.assign({ title: $('#title').value }, CFG));
    go('#/observe/' + r.run_id);
  };
  if (MODE === 'free') buildForm();
}
function buildForm() {
  const f = $('#form'); f.innerHTML = '';
  for (const [g, items] of Object.entries(SCHEMA.schema)) {
    let html = `<div class="card"><div class="ch"><h4>${GROUP_TITLES[g] || g}</h4></div><div class="cb">`;
    for (const [k, s] of Object.entries(items)) {
      const v = CFG[g][k];
      if (s.type === 'apples') { html += `<div class="norm">${s.norm}</div><div id="apple-list"></div><button class="btn small" id="add-apple" style="margin-top:6px">+ яблоко</button>`; continue; }
      if (s.type === 'select') html += `<div class="field"><label>${s.label}<select data-g="${g}" data-k="${k}">${Object.entries(s.options).map(([ov, ol]) => `<option value="${ov}" ${ov === v ? 'selected' : ''}>${ol}</option>`).join('')}</select></label>${s.norm ? `<div class="norm">${s.norm}</div>` : ''}</div>`;
      else if (s.type === 'bool') html += `<div class="field"><label class="toggle">${s.label}<input type="checkbox" data-g="${g}" data-k="${k}" ${v ? 'checked' : ''}></label>${s.norm ? `<div class="norm">${s.norm}</div>` : ''}</div>`;
      else html += `<div class="field"><label>${s.label}<b id="o-${g}-${k}">${fmtv(v, s.step)} ${s.unit}</b></label><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${v}" data-g="${g}" data-k="${k}">${s.norm ? `<div class="norm">Норма: ${s.norm}</div>` : ''}</div>`;
    }
    f.insertAdjacentHTML('beforeend', html + '</div></div>');
  }
  f.querySelectorAll('[data-g]').forEach(inp => inp.oninput = () => { const { g, k } = inp.dataset, s = SCHEMA.schema[g][k];
    CFG[g][k] = inp.type === 'checkbox' ? inp.checked : (inp.tagName === 'SELECT' ? inp.value : +inp.value);
    if (inp.type === 'range') $(`#o-${g}-${k}`).textContent = `${fmtv(inp.value, s.step)} ${s.unit}`;
    if (g === 'world' && k === 'size_m') renderApples(); });
  $('#add-apple').onclick = () => { CFG.apples.list.push({ age_days: 0, cut: true, radius_mm: 30, x_mm: 0, y_mm: 0 }); renderApples(); };
  renderApples();
}
function appleFields(a, i, half) { half = half || CFG.world.size_m * 500;
  return `<div class="field" data-i="${i}"><label><b>Яблоко ${i + 1}</b><button class="btn small" data-del="${i}">удалить</button></label>
    <label>Возраст<b>${(+a.age_days).toFixed(1)} дн</b></label><input type="range" min="0" max="30" step="0.5" value="${a.age_days}" data-f="age_days">
    <label class="toggle">Надрезанное<input type="checkbox" ${a.cut ? 'checked' : ''} data-f="cut"></label>
    <label>Радиус<b>${a.radius_mm} мм</b></label><input type="range" min="10" max="40" step="1" value="${a.radius_mm}" data-f="radius_mm">
    <label>X<b>${(a.x_mm / 1000).toFixed(2)} м</b></label><input type="range" min="${-half}" max="${half}" step="5" value="${a.x_mm}" data-f="x_mm">
    <label>Y<b>${(a.y_mm / 1000).toFixed(2)} м</b></label><input type="range" min="${-half}" max="${half}" step="5" value="${a.y_mm}" data-f="y_mm"></div>`; }
function renderApples() { const box = $('#apple-list'); if (!box) return;
  box.innerHTML = CFG.apples.list.map((a, i) => appleFields(a, i)).join('');
  box.querySelectorAll('[data-f]').forEach(inp => inp.oninput = () => { const i = +inp.closest('[data-i]').dataset.i;
    CFG.apples.list[i][inp.dataset.f] = inp.type === 'checkbox' ? inp.checked : +inp.value; renderApples(); });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { CFG.apples.list.splice(+b.dataset.del, 1); renderApples(); }); }

// ======================= drawing =======================
function fit(c) { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; if (c.width !== Math.round(r.width * d)) { c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); } }
function drag(cv, onMove, redraw) { let d = null;
  cv.addEventListener('pointerdown', e => { d = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!d) return; onMove(e.clientX - d[0], e.clientY - d[1]); d = [e.clientX, e.clientY]; redraw(); });
  cv.addEventListener('pointerup', () => d = null);
  cv.addEventListener('wheel', e => { e.preventDefault(); onMove(0, 0, e.deltaY); redraw(); }, { passive: false }); }
const brainStatic = {};
async function brainOf(ds) { if (!brainStatic[ds]) { brainStatic[ds] = 'loading'; const b = await api('/api/brain/' + ds);
  brainStatic[ds] = { n: b.n, xyz: b64(b.xyz, Float32Array), region: b64(b.region, Uint8Array) }; } return brainStatic[ds]; }
function rnd(seed) { const x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }

function drawArena(cv, st, cur, trails) {
  fit(cv); const sx = cv.getContext('2d'), W = cv.width, H = cv.height, dpr = devicePixelRatio || 1; sx.clearRect(0, 0, W, H); if (!cur) return;
  const A = cur.arena_mm || 55, s = Math.min(W, H) / (2.6 * A) * st.zoom;
  const proj = p => { const ca = Math.cos(st.az), sa = Math.sin(st.az), ce = Math.cos(st.el), se = Math.sin(st.el);
    const x = p[0] * ca - p[1] * sa, y = p[0] * sa + p[1] * ca; return [W / 2 + x * s, H / 2 + (y * ce - p[2] * se) * s * 0.95]; };
  sx.strokeStyle = css('--folder'); sx.lineWidth = 1;
  for (let g = -A; g <= A + 1e-6; g += A / 4) for (const [a, b] of [[[g, -A, 0], [g, A, 0]], [[-A, g, 0], [A, g, 0]]]) { const p = proj(a), q = proj(b); sx.beginPath(); sx.moveTo(...p); sx.lineTo(...q); sx.stroke(); }
  for (const z of cur.zones || []) { sx.fillStyle = z.active === false ? 'rgba(220,38,38,0.07)' : 'rgba(220,38,38,0.22)'; sx.beginPath();
    for (let k = 0; k <= 48; k++) { const a = k / 48 * 2 * Math.PI, p = proj([z.center[0] + z.radius * Math.cos(a), z.center[1] + z.radius * Math.sin(a), 0]); k ? sx.lineTo(...p) : sx.moveTo(...p); } sx.fill(); }

    <div class="card" style="margin-bottom:12px"><div class="ch"><h4>Временная шкала</h4><span>метка = событие; цвет = категория; размер = важность · клик — к событию</span></div><canvas id="timeline"></canvas></div>
    <div class="run"><div class="card"><div class="ch"><h4>События</h4><span>
      <select id="f-imp"><option value="2">важные и главные</option><option value="3">только главные</option><option value="1">все</option></select>
      <select id="f-cat"><option value="">все категории</option>${Object.entries(CAT_RU).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <select id="f-fly"><option value="">все мухи</option>${flies.map(([n]) => `<option>${esc(n)}</option>`).join('')}<option value="мир">мир</option></select></span></div>
      <div class="evlist" id="evlist"></div></div>
    <div style="display:grid;gap:12px;align-content:start">
      <div class="card"><div class="ch"><h4>Преобладание областей мозга во времени</h4><span><label style="font-size:12px"><input type="checkbox" id="r-nosens" checked> без сенсорных</label> <select id="r-fly">${flies.map(([n]) => `<option>${esc(n)}</option>`).join('')}</select></span></div><canvas id="regions"></canvas>
        <div class="legend">${Object.entries(SCHEMA.region_names).map(([k, v]) => `<span><span class="dot" style="background:${SCHEMA.region_colors[k]}"></span>${v}</span>`).join('')} <span>| чёрные линии — главные события</span></div></div>
      <div class="card"><div class="ch"><h4>Мухи (паспорта)</h4></div><div class="cb">${flies.map(([n, s]) => `<button class="btn small" style="margin:2px;border-color:${colorSex(s)}" onclick="passport('${rid}','${esc(n)}')">${esc(n)}</button>`).join('') || 'нет'}</div></div>
      <div class="card"><div class="ch"><h4>Момент</h4><span id="mom-title">выберите событие</span></div><div class="cb" id="moment"><div class="sub">Клик по событию покажет, что было в мозге каждой мухи: какие области преобладали и куда шёл поток сигнала между ними</div></div></div>
    </div></div>`;
  let events = [], series = null;
  document.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => { $('#f-cat').value = el.dataset.cat; $('#f-imp').value = '1'; loadEvents(); });
  const loadEvents = async () => { const p = new URLSearchParams({ min_imp: $('#f-imp').value, cat: $('#f-cat').value, fly: $('#f-fly').value });
    events = (await api(`/api/run/${rid}/events?${p}`)).events; renderList(); drawTimeline(); };
  const renderList = () => { $('#evlist').innerHTML = events.slice().reverse().map(evRow).join('') || '<div class="ev">нет событий по фильтру</div>';
    $('#evlist').querySelectorAll('.ev').forEach(el => el.onclick = () => openEvent(+el.dataset.id, el)); };
  async function openEvent(id, el) {
    const e = events.find(x => x.id === id); if (!e) return;
    if (el.querySelector('.detail')) { el.querySelector('.detail').remove(); el.classList.remove('open'); return; }
    document.querySelectorAll('.ev.open').forEach(x => { x.classList.remove('open'); const d = x.querySelector('.detail'); if (d) d.remove(); });
    el.classList.add('open');
    const fr = await api(`/api/run/${rid}/frame?i=${e.frame}`);
    const brainTxt = fr && fr.flies ? Object.entries(fr.flies).map(([n, f]) => { const tot = (f.regions || []).reduce((a, b) => a + b, 0) || 1;
      const reg = (f.regions || []).map((v, k) => [SCHEMA.region_names[k], Math.round(100 * v / tot)]).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([a, b]) => `${a} ${b}%`).join(', ');
      let top = ''; if (f.flow) { const pairs = []; f.flow.forEach((row, a) => row.forEach((v, b) => { if (a !== b) pairs.push([v, a, b]); }));
        top = pairs.sort((x, y) => y[0] - x[0]).slice(0, 3).map(([v, a, b]) => `${SCHEMA.region_names[a]}→${SCHEMA.region_names[b]} ${v}`).join('; '); }
      return `${n}: активных нейронов ${f.n_active}; преобладают: ${reg || '—'}; сильнейшие потоки: ${top || '—'}; PPL1 ${f.rates?.ppl1 ?? '—'} Гц, PAM ${f.rates?.pam ?? '—'} Гц; голод ${f.hunger}`; }).join('\n') : '(кадр недоступен)';
    const d = document.createElement('div'); d.className = 'detail';
    d.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-a="copy">Копировать</button><a class="btn small" href="#/observe/${rid}/${e.frame}">Перейти к моменту ▸</a><button class="btn small" data-a="close">Свернуть</button></div><pre>${esc(e.text)}\n\nМозг в этот момент:\n${esc(brainTxt)}\n\n${esc(JSON.stringify(e, null, 1))}</pre>`;
    d.onclick = ev => ev.stopPropagation();
    d.querySelector('[data-a=copy]').onclick = () => copy(`${e.fly}: ${e.text}\n${fmtClock(e.clock_h)}, кадр ${e.frame}\n\nМозг в этот момент:\n${brainTxt}\n\n${JSON.stringify(e, null, 1)}`);
    d.querySelector('[data-a=close]').onclick = () => { d.remove(); el.classList.remove('open'); };
    el.appendChild(d); moment(fr, e);
  }
  function moment(fr, e) {
    $('#mom-title').textContent = `${fmtClock(e.clock_h)} · кадр ${e.frame}`;
    if (!fr || !fr.flies) { $('#moment').innerHTML = '<div class="sub">кадр недоступен</div>'; return; }
    const names = SCHEMA.region_names;
    $('#moment').innerHTML = Object.entries(fr.flies).map(([n, f]) => { const fl = f.flow || []; let mx = 1; fl.forEach(r => r.forEach(v => mx = Math.max(mx, v)));
      const cols = Object.keys(names).length + 1;
      return `<div style="margin-bottom:10px"><b style="color:${colorSex(f.sex)}">${esc(n)}</b> <span class="sub">${f.mode}/${f.surface}, PPL1 ${f.rates?.ppl1} Гц, PAM ${f.rates?.pam} Гц</span>${regionBars(f)}
        <div class="sub">поток сигнала между областями (строка → столбец): чем темнее, тем сильнее</div>
        <div class="flow" style="grid-template-columns:repeat(${cols},1fr)"><div></div>${Object.values(names).map(x => `<div title="${x}" style="background:var(--soft)">${x.slice(0, 6)}</div>`).join('')}
        ${fl.map((row, a) => `<div title="${names[a]}" style="background:var(--soft)">${(names[a] || '').slice(0, 6)}</div>` + row.map((v, b) => `<div title="${names[a]} → ${names[b]}: ${v}" style="background:rgba(194,65,12,${(v / mx).toFixed(2)})">&nbsp;</div>`).join('')).join('')}</div></div>`; }).join('');
  }
  function drawTimeline() {
    const cv = $('#timeline'); fit(cv); const c = cv.getContext('2d'), W = cv.width, H = cv.height, dpr = devicePixelRatio || 1;
    c.clearRect(0, 0, W, H); const t0 = info.clock_h[0], t1 = Math.max(info.clock_h[1], ...events.map(e => e.clock_h), t0 + 1e-6);
    const cats = Object.keys(CAT_RU); c.fillStyle = css('--muted'); c.font = `${10 * dpr}px sans-serif`;
    c.fillText(fmtClock(t0), 4, H - 4); c.fillText(fmtClock(t1), W - 70 * dpr, H - 4);
    for (const e of events) { const x = 8 + (W - 16) * (e.clock_h - t0) / (t1 - t0), y = 8 + (H - 30) * cats.indexOf(e.cat) / cats.length;
      c.fillStyle = CAT_COLORS[e.cat] || '#999'; c.globalAlpha = 0.8; c.beginPath(); c.arc(x, y, (1 + e.imp) * dpr, 0, 7); c.fill(); }
    c.globalAlpha = 1;
    cv.onclick = ev => { const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) * dpr, tt = t0 + (x - 8) / (W - 16) * (t1 - t0);
      let best = null, bd = 1e9; for (const e of events) { const d = Math.abs(e.clock_h - tt); if (d < bd) { bd = d; best = e; } }
      if (best) { const el = document.querySelector(`.ev[data-id="${best.id}"]`); if (el) { el.scrollIntoView({ block: 'center' }); openEvent(best.id, el); } } };
  }
  async function drawRegions() {
    if (!series) series = (await api(`/api/run/${rid}/series`)).series;
    const fly = $('#r-fly').value, cv = $('#regions'); fit(cv); const c = cv.getContext('2d'), W = cv.width, H = cv.height; c.clearRect(0, 0, W, H);
    const rows = series.filter(r => r.flies[fly] && r.flies[fly].regions); if (!rows.length) return;
    const R = rows[0].flies[fly].regions.length;
    const nos = $('#r-nosens').checked;
    for (let k = 0; k < rows.length; k++) { const reg = rows[k].flies[fly].regions.map((v, r) => nos && r === 1 ? 0 : v), tot = reg.reduce((a, b) => a + b, 0) || 1; let y = H;
      const x = W * k / rows.length, w = Math.max(1, W / rows.length + 0.5);
      for (let r = 0; r < R; r++) { const h = H * reg[r] / tot; c.fillStyle = SCHEMA.region_colors[r]; c.fillRect(x, y - h, w, h); y -= h; } }
    for (const e of events.filter(e => (e.fly === fly || (e.others || []).includes(fly)) && e.imp >= 3)) { const k = rows.findIndex(r => r.i >= e.frame); if (k < 0) continue;
      c.strokeStyle = css('--ink'); c.lineWidth = 1; c.beginPath(); c.moveTo(W * k / rows.length, 0); c.lineTo(W * k / rows.length, H); c.stroke(); }
  }
  ['f-imp', 'f-cat', 'f-fly'].forEach(id => $('#' + id).onchange = loadEvents);
  $('#r-fly').onchange = drawRegions; $('#r-nosens').onchange = drawRegions;
  $('#copyall').onclick = () => copy(events.map(e => `[${fmtClock(e.clock_h)} | кадр ${e.frame}] ${'!'.repeat(e.imp)} ${e.fly}: ${e.text}`).join('\n'));
  await loadEvents(); if (flies.length) drawRegions();
  if (info.live) timers.push(setTimeout(() => { if (!document.querySelector('.detail')) viewChronicle(rid); }, 20000));
}
async function passport(rid, name) {
  const p = await api(`/api/run/${rid}/fly/${encodeURIComponent(name)}`);
  const m = document.createElement('div'); m.className = 'modal';
  const cov = p.connectome || {};
  const rows = [['ID', p.uid], ['Имя', p.name], ['Пол', p.sex === 'male' ? 'самец' : p.sex === 'female' ? 'самка' : '—'], ['Статус', p.status], ['Происхождение', p.origin], ['Родители', p.parents ? `${p.parents.mother} × ${p.parents.father}` : '—'],
    ['Родилась (мир, ч)', p.born_world_h], ['Возраст, дн', p.age_d], ['Физиологический возраст, дн', p.bio_age_d], ['Нервная система', cov.dataset], ['Нейронов / связей', cov.neurons ? `${cov.neurons.toLocaleString('ru')} / ${cov.connections.toLocaleString('ru')}` : '—'],
    ['Режим механизмов', MODES[p.mode] || p.mode], ['Обходы', (p.shortcuts || []).join('; ') || 'нет'], ['Seed', p.seed], ['Обучение', p.plasticity === undefined ? '—' : p.plasticity ? 'вкл' : 'выкл'], ['Спарена', p.mated ? `да (${p.mate})` : 'нет'],
    ['Голод / энергия / здоровье', p.hunger !== undefined ? `${p.hunger} / ${p.energy} / ${p.health}` : '—'], ['Индивидуальная выносливость', p.tolerances ? Object.entries(p.tolerances).map(([k, v]) => `${k} ${v}`).join(', ') : '—'],
    ['События', Object.entries(p.event_counts || {}).map(([k, v]) => `${CAT_RU[k] || k}: ${v}`).join(', ') || '—']];
  m.innerHTML = `<div class="box"><div style="display:flex;justify-content:space-between;gap:8px"><h3 style="margin:0">Паспорт мухи ${esc(name)}</h3><span><button class="btn small" id="pp-copy">Копировать</button> <button class="btn small" id="pp-x">Закрыть</button></span></div>
    <table class="t" style="margin-top:8px">${rows.map(([k, v]) => `<tr><th style="width:38%">${k}</th><td>${esc(v ?? '—')}</td></tr>`).join('')}</table>
    ${cov.groups ? `<h4>Состав нервной системы</h4><table class="t">${Object.entries(cov.groups).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>` : ''}
    ${cov.missing ? `<h4>Чего нет в нервной системе</h4><ul>${cov.missing.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    <h4>Жизнь (важные события)</h4><div class="evlist" style="max-height:320px">${(p.life || []).slice().reverse().map(evRow).join('') || '<div class="ev">нет</div>'}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('#pp-x').onclick = () => m.remove(); m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelector('#pp-copy').onclick = () => copy(JSON.stringify(p, null, 1));
}
