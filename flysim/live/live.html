<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly-Sim</title>
<meta name="color-scheme" content="light dark">
<script>
  // apply the saved theme before first paint
  try { const t = localStorage.getItem('flysim-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  html, body { margin: 0; background: #f5f5f2; }
  @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #111113; } }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #111113; }
  fs-app:not(:defined) { display: block; padding: 24px 16px; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #8b8b92; }
</style>
<script type="module" src="/static/app.js"></script>
</head>
<body>
<fs-app>Загрузка Fly-Sim…</fs-app>
<noscript>Для Fly-Sim нужен JavaScript.</noscript>
</body>
</html>
