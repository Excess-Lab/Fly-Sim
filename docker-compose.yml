services:
  flysim:
    build: .
    image: flysim:latest
    ports:
      - "8800:8800"
    volumes:
      # connectome data (~0.7 GB, downloaded on first start) and caches stay on your disk
      - ./data:/app/data
      # every run (history, events, logs) is kept on your disk
      - ./results:/app/results
    environment:
      - NUMBA_NUM_THREADS=6
    restart: unless-stopped
