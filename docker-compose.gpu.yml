# GPU add-on (picked automatically by start.sh / start.bat when an NVIDIA GPU is present):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Same image as the CPU version; this only gives the container the GPU.
services:
  flysim:
    environment:
      - FLYSIM_BACKEND=auto
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
